name: Build macOS Isolated Story Engines Test

on:
  push:
    branches:
      - feature-timeclip-mac
      - feature/isolated-story-engines
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v2.3 source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            source/chunks/part00a.b64 \
            source/chunks/part00b.b64 \
            source/chunks/part01.b64 \
            source/chunks/part02.b64 \
            source/chunks/part03.b64 \
            source/chunks/part04.b64 \
            source/chunks/part05.b64 \
            source/chunks/part06.b64 \
            | tr -d '\r\n' | base64 -D > .ci-source.zip
          HASH="$(shasum -a 256 .ci-source.zip | awk '{print $1}')"
          if [ "$HASH" != "236d70e4680e87c53c62c5db15ee96d7d56320578d065db4c421051fc6f35216" ]; then
            echo "Source bundle SHA256 mismatch: $HASH"
            exit 1
          fi
          mkdir -p .ci-src
          unzip -q .ci-source.zip -d .ci-src
          BUILD_SCRIPT="$(find .ci-src -type f -name 'BUILD_DISTRIBUTABLE.command' -print -quit)"
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "BUILD_DISTRIBUTABLE.command not found"
            exit 1
          fi
          SOURCE_ROOT="$(dirname "$BUILD_SCRIPT")"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "Mac runner architecture: $(uname -m)"
          echo "Source root: $SOURCE_ROOT"
          test "$(uname -m)" = "arm64"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Time Range feature and compile-check
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/patches/patch_time_range.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_mac_instagram_recovery.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_core_mac_instagram.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_mac_cookiefile.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_mac_isolated_story_engine.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_mac_facebook_story.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_mac_facebook_post.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_mac_instagram_download_all.py" "$SOURCE_ROOT"
          python "$GITHUB_WORKSPACE/patches/patch_mac_story_diagnostics.py" "$SOURCE_ROOT"
          python -m py_compile "$SOURCE_ROOT/core.py" "$SOURCE_ROOT/app.py"

      - name: Build native Apple Silicon app and DMG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$SOURCE_ROOT/BUILD_DISTRIBUTABLE.command" "$SOURCE_ROOT/build_macos.sh"
          # hdiutil can occasionally report a transient "Resource busy" on
          # hosted macOS runners after signing. Retry the packaging stage once.
          for attempt in 1 2; do
            if zsh "$SOURCE_ROOT/BUILD_DISTRIBUTABLE.command"; then
              break
            fi
            if [ "$attempt" -ge 2 ]; then
              echo "macOS app packaging failed after retry."
              exit 1
            fi
            echo "Build attempt $attempt failed. Waiting and clearing stale disk-image mounts before retry..."
            hdiutil info || true
            sleep 8
          done
          test -f "$SOURCE_ROOT/dist/ReferensiDownloader-AppleSilicon.dmg"
          test -d "$SOURCE_ROOT/dist/Referensi Downloader.app"
          echo "Apple Silicon DMG built successfully."

      - name: Test time parsing and actual FFmpeg section clipping
        shell: bash
        run: |
          set -euo pipefail
          "$SOURCE_ROOT/.buildenv/bin/python" \
            "$GITHUB_WORKSPACE/tests/test_time_range_integration.py" "$SOURCE_ROOT"

      - name: Test Facebook Story media parsing
        shell: bash
        run: |
          set -euo pipefail
          "$SOURCE_ROOT/.buildenv/bin/python" \
            "$GITHUB_WORKSPACE/tests/test_facebook_story_parser.py" "$SOURCE_ROOT"

      - name: Test Facebook Post photo fallback
        shell: bash
        run: |
          set -euo pipefail
          "$SOURCE_ROOT/.buildenv/bin/python" \
            "$GITHUB_WORKSPACE/tests/test_facebook_post_parser.py" "$SOURCE_ROOT"

      - name: Test Instagram Download All folders
        shell: bash
        run: |
          set -euo pipefail
          "$SOURCE_ROOT/.buildenv/bin/python" \
            "$GITHUB_WORKSPACE/tests/test_instagram_download_folders.py" "$SOURCE_ROOT"

      - name: Test isolated Instagram Story engine
        shell: bash
        run: |
          set -euo pipefail
          "$SOURCE_ROOT/.buildenv/bin/python" \
            "$GITHUB_WORKSPACE/tests/test_instagram_story_engine.py" "$SOURCE_ROOT"

      - name: Publish Apple Silicon isolated Story engine test DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: isolated-story-engines-macos-test-v1
          target_commitish: ${{ github.sha }}
          name: Referensi Downloader — Isolated Story Engines Test
          body: |
            Experimental Apple Silicon build with a separate official gallery-dl daily binary for Instagram Story/Highlights.
            Existing Instagram post, Reel, and carousel paths remain on the pinned Python gallery-dl package.
            Facebook Story remains on its dedicated local parser and DASH quality path.

            Build, time-range tests, Facebook Story parser tests, and isolated Instagram Story engine tests must pass.
            This is a test build; verify it with Story URLs before wider distribution.
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: .ci-src/ReferensiDownloader_v2.3/dist/ReferensiDownloader-AppleSilicon.dmg
