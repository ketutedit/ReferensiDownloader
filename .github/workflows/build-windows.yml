name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: pwsh
        run: |
          $names = @(
            "part00a.b64", "part00b.b64",
            "part01.b64", "part02.b64", "part03.b64",
            "part04.b64", "part05.b64", "part06.b64"
          )
          $b64 = ""
          foreach ($name in $names) {
            $path = Join-Path "source/chunks" $name
            if (-not (Test-Path $path)) { throw "Missing source chunk: $path" }
            $b64 += (Get-Content $path -Raw).Trim()
          }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes(".ci-source.zip", $bytes)
          $hash = (Get-FileHash ".ci-source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "236d70e4680e87c53c62c5db15ee96d7d56320578d065db4c421051fc6f35216") {
            throw "Source bundle SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force -Path .ci-src | Out-Null
          Expand-Archive -Path .ci-source.zip -DestinationPath .ci-src -Force
          $buildScript = Get-ChildItem .ci-src -Recurse -Filter build_windows.ps1 | Select-Object -First 1
          if (-not $buildScript) { throw "build_windows.ps1 not found after extraction" }
          "SOURCE_ROOT=$($buildScript.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Source root: $($buildScript.Directory.FullName)"

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Apply Windows Smart Editing MP4 stability patch
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\patches\patch_core_windows_smart_mp4.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Smart Editing patch failed." }
          python "$env:GITHUB_WORKSPACE\patches\patch_core_windows_instagram.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Instagram compatibility patch failed." }
          python "$env:GITHUB_WORKSPACE\patches\patch_windows_cookiefile.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "cookies.txt fallback patch failed." }
          python "$env:GITHUB_WORKSPACE\patches\patch_windows_time_range.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Time Range segment patch failed." }
          python "$env:GITHUB_WORKSPACE\patches\patch_windows_facebook_story.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Facebook Story patch failed." }
          python "$env:GITHUB_WORKSPACE\patches\patch_windows_facebook_post.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Facebook Post fallback patch failed." }
          python "$env:GITHUB_WORKSPACE\patches\patch_windows_facebook_mixed_post.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Facebook mixed photo/video patch failed." }
          python "$env:GITHUB_WORKSPACE\patches\patch_windows_instagram_download_all.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Instagram Download All folder patch failed." }
          python -m py_compile "$env:SOURCE_ROOT\core.py" "$env:SOURCE_ROOT\app.py"
          if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed." }

      - name: Build Windows portable + installer
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_ROOT
          .\build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows build script failed." }
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "ci-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item ".\dist\ReferensiDownloader-Windows-x64-Portable.zip" (Join-Path $artifactDir "ReferensiDownloader-Windows-x64-Portable.zip") -Force
          Copy-Item ".\dist\installer\ReferensiDownloader-Windows-x64-Setup.exe" (Join-Path $artifactDir "ReferensiDownloader-Windows-x64-Setup.exe") -Force
          Get-ChildItem $artifactDir | Format-Table Name,Length
          # build_windows.ps1 installs its dependencies into the Python 3.12
          # interpreter provided by setup-python; reuse that interpreter for tests.
          $testPython = (Get-Command python).Source
          if (-not $testPython) { throw "Python 3.12 was not found for regression tests." }
          "TEST_PYTHON=$testPython" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test Windows Time Range Download only this Segment
        shell: pwsh
        run: |
          & "$env:TEST_PYTHON" "$env:GITHUB_WORKSPACE\tests\test_windows_time_range.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Time Range regression test failed." }

      - name: Test Facebook Story media parsing
        shell: pwsh
        run: |
          & "$env:TEST_PYTHON" "$env:GITHUB_WORKSPACE\tests\test_facebook_story_parser.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Facebook Story parser regression test failed." }

      - name: Test Facebook Post photo/video fallback
        shell: pwsh
        run: |
          & "$env:TEST_PYTHON" "$env:GITHUB_WORKSPACE\tests\test_facebook_post_parser.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Facebook Post parser regression test failed." }

      - name: Test Instagram Download All folders
        shell: pwsh
        run: |
          & "$env:TEST_PYTHON" "$env:GITHUB_WORKSPACE\tests\test_instagram_download_folders.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Instagram Download All regression test failed." }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReferensiDownloader-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: ci-artifacts/*

      - name: Publish direct Windows downloads
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          target_commitish: ${{ github.sha }}
          name: Referensi Downloader — Windows x64 (Latest)
          body: |
            Automated Windows x64 build of Referensi Downloader v2.3.

            Includes the Smart Editing MP4 stability patch plus Instagram Story/profile-cookie handling improvements.
            Download the Setup.exe asset for the installer, or the Portable.zip asset for the portable build.
          prerelease: true
          overwrite_files: true
          files: ci-artifacts/*

      - name: Attach files to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ci-artifacts/*
