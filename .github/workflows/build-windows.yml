name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: pwsh
        run: |
          $names = @(
            "part00a.b64", "part00b.b64",
            "part01.b64", "part02.b64", "part03.b64",
            "part04.b64", "part05.b64", "part06.b64"
          )
          $b64 = ""
          foreach ($name in $names) {
            $path = Join-Path "source/chunks" $name
            if (-not (Test-Path $path)) { throw "Missing source chunk: $path" }
            $b64 += (Get-Content $path -Raw).Trim()
          }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes(".ci-source.zip", $bytes)
          $hash = (Get-FileHash ".ci-source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "236d70e4680e87c53c62c5db15ee96d7d56320578d065db4c421051fc6f35216") {
            throw "Source bundle SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force -Path .ci-src | Out-Null
          Expand-Archive -Path .ci-source.zip -DestinationPath .ci-src -Force
          $buildScript = Get-ChildItem .ci-src -Recurse -Filter build_windows.ps1 | Select-Object -First 1
          if (-not $buildScript) { throw "build_windows.ps1 not found after extraction" }
          "SOURCE_ROOT=$($buildScript.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Source root: $($buildScript.Directory.FullName)"

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Build Windows portable + installer
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_ROOT
          .\build_windows.ps1
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE ".ci-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item ".\dist\ReferensiDownloader-Windows-x64-Portable.zip" (Join-Path $artifactDir "ReferensiDownloader-Windows-x64-Portable.zip") -Force
          Copy-Item ".\dist\installer\ReferensiDownloader-Windows-x64-Setup.exe" (Join-Path $artifactDir "ReferensiDownloader-Windows-x64-Setup.exe") -Force
          Get-ChildItem $artifactDir | Format-Table Name,Length

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReferensiDownloader-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: .ci-artifacts/*

      - name: Attach files to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .ci-artifacts/*
