name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and extract source bundle
        shell: pwsh
        run: |
          $bad = [IO.File]::ReadAllBytes("source/ReferensiDownloader-v2.3-GitHub-WindowsBuilder.zip")
          $midB64 = (Get-Content "source/missing-middle.b64" -Raw).Trim()
          $mid = [Convert]::FromBase64String($midB64)
          if ($mid.Length -ne 6000) { throw "Unexpected middle chunk length: $($mid.Length)" }
          $split = 24000
          $fixed = New-Object byte[] ($bad.Length + $mid.Length)
          [Array]::Copy($bad, 0, $fixed, 0, $split)
          [Array]::Copy($mid, 0, $fixed, $split, $mid.Length)
          [Array]::Copy($bad, $split, $fixed, $split + $mid.Length, $bad.Length - $split)
          [IO.File]::WriteAllBytes(".ci-source.zip", $fixed)
          New-Item -ItemType Directory -Force -Path .ci-src | Out-Null
          Expand-Archive -Path .ci-source.zip -DestinationPath .ci-src -Force
          Get-ChildItem .ci-src -Recurse -Depth 2 | Select-Object FullName

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Build Windows portable + installer
        shell: pwsh
        working-directory: .ci-src/ReferensiDownloader_v2.3
        run: .\build_windows.ps1

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReferensiDownloader-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            .ci-src/ReferensiDownloader_v2.3/dist/ReferensiDownloader-Windows-x64-Portable.zip
            .ci-src/ReferensiDownloader_v2.3/dist/installer/ReferensiDownloader-Windows-x64-Setup.exe

      - name: Attach files to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .ci-src/ReferensiDownloader_v2.3/dist/ReferensiDownloader-Windows-x64-Portable.zip
            .ci-src/ReferensiDownloader_v2.3/dist/installer/ReferensiDownloader-Windows-x64-Setup.exe
