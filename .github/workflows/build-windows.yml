name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Extract source bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-src | Out-Null
          Expand-Archive -Path source/ReferensiDownloader-v2.3-GitHub-WindowsBuilder.zip -DestinationPath .ci-src -Force

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: .ci-src/ReferensiDownloader_v2.3/requirements.txt

      - name: Build Windows portable + installer
        shell: pwsh
        working-directory: .ci-src/ReferensiDownloader_v2.3
        run: .\build_windows.ps1

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReferensiDownloader-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            .ci-src/ReferensiDownloader_v2.3/dist/ReferensiDownloader-Windows-x64-Portable.zip
            .ci-src/ReferensiDownloader_v2.3/dist/installer/ReferensiDownloader-Windows-x64-Setup.exe

      - name: Attach files to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .ci-src/ReferensiDownloader_v2.3/dist/ReferensiDownloader-Windows-x64-Portable.zip
            .ci-src/ReferensiDownloader_v2.3/dist/installer/ReferensiDownloader-Windows-x64-Setup.exe
