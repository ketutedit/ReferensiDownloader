name: Inspect Facebook Story quality wiring

on:
  push:
    branches: [feature-timeclip-mac]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and inspect quality wiring
        shell: bash
        run: |
          set -euo pipefail
          cat source/chunks/part00a.b64 source/chunks/part00b.b64 source/chunks/part01.b64 source/chunks/part02.b64 source/chunks/part03.b64 source/chunks/part04.b64 source/chunks/part05.b64 source/chunks/part06.b64 | tr -d '\r\n' | base64 -D > .ci-source.zip
          echo "236d70e4680e87c53c62c5db15ee96d7d56320578d065db4c421051fc6f35216  .ci-source.zip" | shasum -a 256 -c -
          mkdir .ci-src
          unzip -q .ci-source.zip -d .ci-src
          SOURCE_ROOT="$(dirname "$(find .ci-src -type f -name BUILD_DISTRIBUTABLE.command -print -quit)")"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          export SOURCE_ROOT
          python - <<'PY'
          import ast, os, sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          root=Path(os.environ["SOURCE_ROOT"])
          for filename in ("core.py","app.py"):
              path=root/filename
              text=path.read_text(encoding="utf-8")
              lines=text.splitlines()
              tree=ast.parse(text)
              print("\\n=====", filename, "=====")
              names_core={"QualityOption","MediaItem","MediaInfo","analyze_url","download_direct_item"}
              names_app={"AnalyzeWorker","DownloadWorker","MainWindow"}
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                      if filename=="core.py" and node.name in names_core:
                          print(f"\\n--- {node.name} lines {node.lineno}-{node.end_lineno} ---")
                          print("\\n".join(f"{i+1}: {lines[i]}" for i in range(node.lineno-1,node.end_lineno)))
                      if filename=="app.py" and isinstance(node,ast.ClassDef) and node.name in names_app:
                          for member in node.body:
                              if isinstance(member,ast.FunctionDef) and member.name in {
                                  "__init__","_analysis_done","_populate_quality","_selected_media_item",
                                  "download","_download_instagram_items","run"
                              }:
                                  print(f"\\n--- {node.name}.{member.name} lines {member.lineno}-{member.end_lineno} ---")
                                  print("\\n".join(f"{i+1}: {lines[i]}" for i in range(member.lineno-1,member.end_lineno)))
          PY
