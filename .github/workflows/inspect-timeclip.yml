name: Inspect Time Clip Integration

on:
  push:
    branches: [inspect-timeclip]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: pwsh
        run: |
          $names = @(
            "part00a.b64", "part00b.b64",
            "part01.b64", "part02.b64", "part03.b64",
            "part04.b64", "part05.b64", "part06.b64"
          )
          $b64 = ""
          foreach ($name in $names) {
            $path = Join-Path "source/chunks" $name
            if (-not (Test-Path $path)) { throw "Missing source chunk: $path" }
            $b64 += (Get-Content $path -Raw).Trim()
          }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes(".ci-source.zip", $bytes)
          $hash = (Get-FileHash ".ci-source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "236d70e4680e87c53c62c5db15ee96d7d56320578d065db4c421051fc6f35216") { throw "Source bundle SHA256 mismatch: $hash" }
          Expand-Archive -Path .ci-source.zip -DestinationPath .ci-src -Force
          $buildScript = Get-ChildItem .ci-src -Recurse -Filter build_windows.ps1 | Select-Object -First 1
          "SOURCE_ROOT=$($buildScript.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $env:SOURCE_ROOT -File | Select-Object Name,Length | Format-Table -AutoSize

      - name: Inspect Python function structure and selected implementations
        shell: pwsh
        run: |
          @'
          import ast, os
          from pathlib import Path
          root = Path(os.environ["SOURCE_ROOT"])
          def dump(name, nodes):
              source = (root / name).read_text(encoding="utf-8")
              lines = source.splitlines()
              print("\\n===== " + name + " =====")
              for node in nodes:
                  print(f"\\n--- {node.name} ({node.lineno}-{node.end_lineno}) ---")
                  print("\\n".join(f"{i+1}: {lines[i]}" for i in range(node.lineno-1, node.end_lineno)))
          core_path = root / "core.py"
          core_src = core_path.read_text(encoding="utf-8")
          core_tree = ast.parse(core_src)
          wanted_core = {"_download_once", "download_media"}
          dump("core.py", [n for n in core_tree.body if isinstance(n, ast.FunctionDef) and n.name in wanted_core])
          app_path = root / "app.py"
          app_src = app_path.read_text(encoding="utf-8")
          app_tree = ast.parse(app_src)
          app_nodes = []
          for n in app_tree.body:
              if isinstance(n, ast.ClassDef) and n.name in {"DownloadWorker", "AnalyzeWorker", "MainWindow"}:
                  if n.name in {"DownloadWorker", "AnalyzeWorker"}:
                      app_nodes.append(n)
                  else:
                      app_nodes.extend(x for x in n.body if isinstance(x, ast.FunctionDef) and x.name in {
                          "__init__", "analyze", "download", "_analysis_done", "_download_done",
                          "_download_error", "_worker_error", "_progress", "_browser_changed"
                      })
          dump("app.py", app_nodes)
          '@ | python -
